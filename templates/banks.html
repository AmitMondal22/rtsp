<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bank Management – OTP Shield Access Management" />
    <link rel="icon" type="image/png" href="/static/image/logo/OTP_Shield_Access_Management.png" />
    <title>Bank Management — OTP Shield Access Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=3.0" />
</head>

<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col h-screen overflow-hidden antialiased selection:bg-sky-100 selection:text-sky-700">

    <!-- ── Top Header Navigation ── -->
    {% include 'components/topbar.html' %}

    <!-- Page Body -->
    <div class="flex flex-1 overflow-hidden">

        <!-- ── Left Navigation Sidebar ── -->
        {% include 'components/sidebar.html' %}

        <!-- Main Content -->
        <main class="flex-1 bg-[#f8fafc] overflow-y-auto p-6">
            <div class="max-w-5xl mx-auto space-y-6">

                <!-- Page Header with Add Bank Modal Trigger -->
                <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                    <div>
                        <h1 class="text-lg font-bold text-slate-900">Bank Management</h1>
                        <p class="text-xs text-slate-500">Configure registered banks and bank administrator accounts</p>
                    </div>
                    <button id="open-add-bank-modal" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 active:scale-95 transition text-white font-bold rounded-lg text-xs flex items-center shadow-xs">
                        <i class="bi bi-plus-lg mr-1.5"></i> Add Bank
                    </button>
                </div>

                <!-- Registered Banks Table -->
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-xs">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                        <div class="flex items-center space-x-2">
                            <i class="bi bi-list-task text-sky-600 text-lg"></i>
                            <h2 class="text-sm font-bold text-slate-900">Registered Banks</h2>
                        </div>
                        <span id="banks-count" class="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-semibold"></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-400 text-[10px] uppercase tracking-wider">
                                    <th class="py-3 pr-4 font-bold w-16">ID</th>
                                    <th class="py-3 pr-4 font-bold">Bank Name</th>
                                    <th class="py-3 pr-4 font-bold">Bank Admin</th>
                                    <th class="py-3 pr-4 font-bold">Created At</th>
                                    <th class="py-3 font-bold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="banks-table-body" class="divide-y divide-slate-100 text-slate-700">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400 text-xs">
                                        <i class="bi bi-arrow-repeat mr-2 animate-spin"></i> Loading banks...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Add Bank Modal -->
    <div id="add-bank-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white border border-slate-200 rounded-xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50 shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="bi bi-bank text-sky-600 text-lg"></i>
                    <h3 class="font-bold text-slate-900 text-sm">Add New Bank &amp; Admin</h3>
                </div>
                <button id="close-add-bank-modal" type="button" class="text-slate-400 hover:text-slate-700"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="add-bank-form" class="flex flex-col flex-1 min-h-0 overflow-hidden text-xs">
                <div class="p-5 space-y-4 overflow-y-auto flex-1">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Bank Name *</label>
                        <input id="bank-name" type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" placeholder="e.g. Central City Bank" required />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Bank Admin Username *</label>
                        <input id="bank-admin-username" type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" placeholder="e.g. bankadmin" required />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Admin Email *</label>
                        <input id="bank-admin-email" type="email" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" placeholder="admin@bank.com" required />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Admin Password *</label>
                        <input id="bank-admin-password" type="password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" placeholder="Min 6 characters" required />
                    </div>
                    <p id="add-bank-error" class="text-rose-600 text-xs"></p>
                </div>
                <div class="flex justify-end space-x-3 p-4 border-t border-slate-100 bg-slate-50 shrink-0">
                    <button type="button" id="cancel-add-bank" class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 hover:bg-slate-100 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 transition text-white font-bold rounded-lg text-xs shadow-xs">Create Bank</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Bank Modal -->
    <div id="edit-bank-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white border border-slate-200 rounded-xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50 shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="bi bi-pencil-square text-sky-600 text-lg"></i>
                    <h3 class="font-bold text-slate-900 text-sm">Edit Bank Info</h3>
                </div>
                <button id="close-edit-bank-modal" type="button" class="text-slate-400 hover:text-slate-700"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="edit-bank-form" class="flex flex-col flex-1 min-h-0 overflow-hidden text-xs">
                <input type="hidden" id="edit-bank-id" />
                <div class="p-5 space-y-4 overflow-y-auto flex-1">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Bank Name *</label>
                        <input id="edit-bank-name" type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" required />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Bank Admin Username</label>
                        <input id="edit-bank-admin-username" type="text" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Admin Email</label>
                        <input id="edit-bank-admin-email" type="email" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Admin Password <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
                        <input id="edit-bank-admin-password" type="password" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 focus:outline-none focus:border-sky-500" placeholder="New password" />
                    </div>
                    <p id="edit-bank-error" class="text-rose-600 text-xs"></p>
                </div>
                <div class="flex justify-end space-x-3 p-4 border-t border-slate-100 bg-slate-50 shrink-0">
                    <button type="button" id="cancel-edit-bank" class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 hover:bg-slate-100 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 transition text-white font-bold rounded-lg text-xs shadow-xs">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/nav.js?v=50.0"></script>
    <script src="/static/banks.js?v=3.0"></script>
</body>
</html>
