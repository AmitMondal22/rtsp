<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bank Management – IOTBLITZ" />
    <title>Bank Management – IOTBLITZ</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#9060ff',
                            blue: '#1a8cff',
                            darkBg: '#111217',
                            sidebar: '#1c1d22',
                            iconbar: '#15161b',
                            cardBg: '#1e1f25',
                            border: '#2b2c33',
                            muted: '#85868e',
                            danger: '#ef4444',
                            success: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=1.2" />
</head>

<body class="bg-brand-darkBg text-slate-100 min-h-screen flex flex-col h-screen overflow-hidden antialiased selection:bg-brand-blue selection:text-white">

    <!-- Top Navigation Bar -->
    <nav class="bg-brand-sidebar border-b border-brand-border px-4 py-2 flex items-center justify-between shrink-0 select-none">
        <div class="flex items-center space-x-4">
            <a class="text-brand-purple font-bold tracking-widest text-xs uppercase flex items-center" href="/dashboard">
                <i class="bi bi-camera-video-fill mr-2.5"></i> IOTBLITZ
            </a>
            <div class="border-l border-brand-border pl-4 flex items-center space-x-1 text-brand-muted text-xs">
                <i class="bi bi-bank2 mr-1 text-brand-blue"></i>
                <span class="text-white font-semibold">Bank Management</span>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <!-- Account Dropdown -->
            <div class="relative inline-block text-left" id="user-profile-dropdown">
                <button class="hover:text-white transition cursor-pointer flex items-center focus:outline-none"
                    id="user-menu-btn" title="User Profile">
                    <i class="bi bi-person-circle text-slate-300 hover:text-white text-lg"></i>
                </button>
                <div id="user-dropdown-menu"
                    class="absolute right-0 mt-2.5 w-48 bg-brand-cardBg border border-brand-border rounded shadow-2xl py-2 z-50 hidden">
                    <div class="px-3 py-1 border-b border-brand-border text-brand-muted text-[9px] font-bold uppercase tracking-wider">Account Info</div>
                    <div class="px-3 py-2 text-[11px] text-slate-300">
                        <span class="block font-semibold text-white truncate" id="user-dropdown-username">Username</span>
                        <span class="block text-brand-muted text-[10px] mt-0.5" id="user-dropdown-role">ROLE</span>
                    </div>
                    <div class="border-t border-brand-border my-1"></div>
                    <button id="logout-btn" class="w-full text-left px-3 py-1.5 hover:bg-brand-border hover:text-white text-[11px] text-brand-danger transition flex items-center">
                        <i class="bi bi-box-arrow-right mr-2"></i> Log Out
                    </button>
                </div>
            </div>

            <!-- Clock -->
            <div class="border-l border-brand-border pl-4 text-right leading-tight font-mono select-none" style="font-size: 10px;">
                <div id="nav-clock" class="text-white font-semibold">12:34:00 AM</div>
                <div id="nav-date" class="text-brand-muted">2026/07/15</div>
            </div>
        </div>
    </nav>

    <!-- Page Body -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Left Icon Sidebar -->
        <aside class="w-14 bg-brand-iconbar border-r border-brand-border flex flex-col items-center py-4 space-y-4 shrink-0">
            <a href="/dashboard" title="Cameras & Live Feed"
                class="w-8 h-8 rounded flex items-center justify-center text-slate-400 hover:text-white hover:bg-brand-blue/20 active:scale-95 transition">
                <i class="bi bi-camera-video-fill text-base"></i>
            </a>
            <a href="/banks" title="Bank Management"
                class="w-8 h-8 rounded flex items-center justify-center text-white bg-brand-blue active:scale-95 transition">
                <i class="bi bi-bank text-base"></i>
            </a>
            <a href="/branches" id="nav-branches-link" title="Branch Management"
                class="w-8 h-8 rounded flex items-center justify-center text-slate-400 hover:text-white hover:bg-brand-blue/20 active:scale-95 transition hidden">
                <i class="bi bi-diagram-3-fill text-base"></i>
            </a>
            <a href="/users" id="nav-users-link" title="User Management"
                class="w-8 h-8 rounded flex items-center justify-center text-slate-400 hover:text-white hover:bg-brand-blue/20 active:scale-95 transition hidden">
                <i class="bi bi-people text-base"></i>
            </a>
            <a href="/manage-otp" title="Manage OTP"
                class="w-8 h-8 rounded flex items-center justify-center text-slate-400 hover:text-white hover:bg-brand-blue/20 active:scale-95 transition">
                <i class="bi bi-key-fill text-base"></i>
            </a>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 bg-brand-darkBg overflow-y-auto p-6">
            <div class="max-w-5xl mx-auto space-y-6">

                <!-- Page Header with Add Bank Modal -->
                <div class="flex items-center justify-between border-b border-brand-border pb-4">
                    <div class="flex items-center space-x-3">
                        <i class="bi bi-bank2 text-brand-blue text-2xl"></i>
                        <div>
                            <h1 class="text-lg font-bold text-white">Bank Management</h1>
                            <p class="text-xs text-brand-muted">Configure registered banks and bank administrator accounts</p>
                        </div>
                    </div>
                    <button id="open-add-bank-modal" class="px-4 py-2 bg-brand-blue hover:bg-brand-blue/90 active:scale-95 transition text-white font-bold rounded-lg text-xs flex items-center shadow-lg">
                        <i class="bi bi-plus-lg mr-1.5"></i> Add Bank
                    </button>
                </div>

                <!-- Registered Banks Table -->
                <div class="bg-brand-sidebar border border-brand-border rounded-xl p-6">
                    <div class="flex items-center justify-between border-b border-brand-border pb-4 mb-5">
                        <div class="flex items-center space-x-2">
                            <i class="bi bi-list-task text-brand-blue text-lg"></i>
                            <h2 class="text-sm font-bold text-white">Registered Banks</h2>
                        </div>
                        <span id="banks-count" class="bg-brand-darkBg px-2 py-0.5 rounded text-[10px] text-brand-muted font-normal"></span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="border-b border-brand-border text-brand-muted text-xs uppercase tracking-wider">
                                    <th class="py-3 pr-4 font-bold w-16">ID</th>
                                    <th class="py-3 pr-4 font-bold">Bank Name</th>
                                    <th class="py-3 pr-4 font-bold">Bank Admin</th>
                                    <th class="py-3 pr-4 font-bold">Created At</th>
                                    <th class="py-3 font-bold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="banks-table-body" class="divide-y divide-brand-border/40 text-slate-300">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-brand-muted text-xs">
                                        <i class="bi bi-hourglass-split mr-2 animate-spin"></i> Loading banks...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div id="add-bank-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-brand-sidebar border border-brand-border rounded-xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-brand-border bg-brand-darkBg shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="bi bi-bank2 text-brand-blue text-lg"></i>
                    <h3 class="font-bold text-white text-sm">Add New Bank &amp; Admin</h3>
                </div>
                <button id="close-add-bank-modal" type="button" class="text-brand-muted hover:text-white"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="add-bank-form" class="flex flex-col flex-1 min-h-0 overflow-hidden">
                <div class="p-5 space-y-4 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Bank Name *</label>
                    <input id="bank-name" type="text"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="e.g. Chase Bank" required />
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Bank Admin Username *</label>
                    <input id="bank-admin-username" type="text"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="e.g. chaseadmin" required />
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Admin Email *</label>
                    <input id="bank-admin-email" type="email"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="admin@bank.com" required />
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Admin Password *</label>
                    <input id="bank-admin-password" type="password"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="Min 6 characters" required />
                </div>
                <p id="add-bank-error" class="text-brand-danger text-xs"></p>
            </div>
            <div class="flex justify-end space-x-3 p-4 border-t border-brand-border bg-brand-darkBg shrink-0">
                <button type="button" id="cancel-add-bank" class="px-4 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-xs text-slate-300 hover:bg-brand-border transition">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-brand-blue hover:bg-brand-blue/90 transition text-white font-bold rounded-lg text-xs">Create Bank</button>
            </div>
        </form>
    </div>
    </div>

    <!-- ── Edit Bank Modal ── -->
    <div id="edit-bank-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-brand-sidebar border border-brand-border rounded-xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-brand-border bg-brand-darkBg shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="bi bi-pencil-square text-brand-blue text-lg"></i>
                    <h3 class="font-bold text-white text-sm">Edit Bank &amp; Admin</h3>
                </div>
                <button id="close-edit-bank-modal" type="button" class="text-brand-muted hover:text-white"><i class="bi bi-x-lg"></i></button>
            </div>
            <form id="edit-bank-form" class="flex flex-col flex-1 min-h-0 overflow-hidden">
                <input type="hidden" id="edit-bank-id" />
                <div class="p-5 space-y-4 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Bank Name *</label>
                    <input id="edit-bank-name" type="text"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="e.g. Chase Bank" required />
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Bank Admin Username</label>
                    <input id="edit-bank-admin-username" type="text"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="e.g. chaseadmin" />
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Admin Email</label>
                    <input id="edit-bank-admin-email" type="email"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="admin@bank.com" />
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Admin Password <span class="text-brand-muted font-normal lowercase">(leave blank to keep current)</span></label>
                    <input id="edit-bank-admin-password" type="password"
                        class="w-full px-3 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue"
                        placeholder="New password (optional)" />
                </div>
                <p id="edit-bank-error" class="text-brand-danger text-xs"></p>
            </div>
            <div class="flex justify-end space-x-3 p-4 border-t border-brand-border bg-brand-darkBg shrink-0">
                <button type="button" id="cancel-edit-bank" class="px-4 py-2 bg-brand-darkBg border border-brand-border rounded-lg text-xs text-slate-300 hover:bg-brand-border transition">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-brand-blue hover:bg-brand-blue/90 transition text-white font-bold rounded-lg text-xs">Save Changes</button>
            </div>
        </form>
    </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/static/banks.js?v=1.2"></script>
</body>
</html>
