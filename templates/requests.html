<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pending Access Requests — OTP Shield Access Management" />
    <link rel="icon" type="image/png" href="/static/image/logo/OTP_Shield_Access_Management.png" />
    <title>Pending Access Requests — OTP Shield Access Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=6.0" />
</head>

<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col h-screen overflow-hidden antialiased selection:bg-sky-100 selection:text-sky-700">

    {% include 'components/topbar.html' %}

    <div class="flex flex-1 overflow-hidden">
        {% include 'components/sidebar.html' %}

        <main class="flex-1 bg-[#f8fafc] overflow-y-auto p-6 flex flex-col min-w-0">
            <section class="flex flex-col space-y-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Pending Access Requests</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Review and authorize dual-key access requests from field hardware.</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="process-all-requests-btn" onclick="if(typeof window.processAllRequests === 'function') window.processAllRequests(this);" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-xs flex items-center transition cursor-pointer">
                            <i class="bi bi-lightning-charge-fill mr-1.5 text-amber-300"></i> Fast Process All
                        </button>
                        <button onclick="if(typeof window.loadOtpRequests === 'function') window.loadOtpRequests();" class="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold shadow-xs hover:bg-slate-50 cursor-pointer flex items-center">
                            <i class="bi bi-arrow-clockwise mr-1 text-sky-600"></i> Refresh
                        </button>
                    </div>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-xs space-y-4">
                    <div id="full-requests-list" class="space-y-3">
                        <div class="text-center py-6 text-slate-400 text-xs">Loading active access requests...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>    <script src="/static/nav.js?v=50.0"></script>

    <script src="/static/app.js?v=24.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.initHeaderClock === 'function') window.initHeaderClock();
            if (typeof window.checkUserRoleAndPermissions === 'function') window.checkUserRoleAndPermissions();
            if (typeof window.loadOrganizationsDropdown === 'function') await window.loadOrganizationsDropdown();
            if (typeof window.loadOtpRequests === 'function') await window.loadOtpRequests();

            // Auto-refresh every 5 seconds for live request status
            setInterval(async () => {
                if (document.hidden) return;
                if (typeof window.loadOtpRequests === 'function') await window.loadOtpRequests();
            }, 5000);
        });
    </script>
</body>
</html>
