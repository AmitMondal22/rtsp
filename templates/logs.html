<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Event Logs & Audit Trail — OTP Shield Access Management" />
    <link rel="icon" type="image/png" href="/static/image/logo/OTP_Shield_Access_Management.png" />
    <title>Event Logs & Audit Trail — OTP Shield Access Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=6.0" />
</head>

<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col h-screen overflow-hidden antialiased selection:bg-sky-100 selection:text-sky-700">

    {% include 'components/topbar.html' %}

    <div class="flex flex-1 overflow-hidden">
        {% include 'components/sidebar.html' %}

        <main class="flex-1 bg-[#f8fafc] overflow-y-auto p-6 flex flex-col min-w-0">
            <section class="flex flex-col space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Event Logs & Audit Trail</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Audit logs of all access requests, stream connects, and user authentications.</p>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-xs">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 pb-2">
                                    <th class="py-2.5 px-3">Timestamp</th>
                                    <th class="py-2.5 px-3">Event Type</th>
                                    <th class="py-2.5 px-3">Device</th>
                                    <th class="py-2.5 px-3">Details / User</th>
                                    <th class="py-2.5 px-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="audit-table-body" class="divide-y divide-slate-100 text-slate-700 font-mono text-[11px]">
                                <tr>
                                    <td colspan="5" class="py-6 text-center text-slate-400 font-sans">
                                        Loading audit logs...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/nav.js?v=50.0"></script>
    <script src="/static/app.js?v=17.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.initHeaderClock === 'function') window.initHeaderClock();
            if (typeof window.checkUserRoleAndPermissions === 'function') window.checkUserRoleAndPermissions();
            if (typeof window.loadOrganizationsDropdown === 'function') await window.loadOrganizationsDropdown();
            if (typeof window.renderOverviewDashboard === 'function') window.renderOverviewDashboard();
        });
    </script>
</body>
</html>
