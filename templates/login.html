<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="IP Camera Manager Login." />
    <title>Surveillance System — Sign In</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#9060ff',
                            blue: '#1a8cff',
                            darkBg: '#111217',
                            sidebar: '#1c1d22',
                            border: '#2b2c33',
                            muted: '#85868e',
                            danger: '#ef4444',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=1.2" />
</head>

<body class="bg-brand-darkBg text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-brand-blue selection:text-white">

    <div class="w-full max-w-md bg-brand-sidebar border border-brand-border rounded-lg shadow-2xl overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brand-blue/10 border border-brand-blue/30 rounded-full flex items-center justify-center mx-auto mb-3 text-brand-blue text-2xl">
                    <i class="bi bi-camera-video-fill"></i>
                </div>
                <h3 class="text-xl font-bold text-white">IP Camera Manager</h3>
                <p class="text-brand-muted text-xs mt-1">IP Camera Manager Surveillance System</p>
            </div>

            <!-- Sign In Header -->
            <div class="border-b border-brand-border pb-3 mb-6 flex items-center justify-between">
                <h4 class="text-sm font-bold text-white uppercase tracking-wider flex items-center">
                    <i class="bi bi-box-arrow-in-right text-brand-blue mr-2 text-base"></i> Sign In to Account
                </h4>
                <span class="text-[10px] bg-brand-blue/20 text-brand-blue font-semibold px-2 py-0.5 rounded">Authorized Access Only</span>
            </div>

            <!-- Forms Container -->
            <div>
                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Email or Username *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input id="login-username" type="text" class="w-full pl-10 pr-4 py-2.5 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Enter your email or username" required />
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Password *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input id="login-password" type="password" class="w-full pl-10 pr-4 py-2.5 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Enter password" required />
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-brand-blue hover:bg-brand-blue/90 active:scale-[0.98] transition text-white font-bold rounded text-sm mt-6 flex items-center justify-center shadow-lg">
                        <i class="bi bi-shield-lock mr-2"></i> Sign In
                    </button>
                    <p id="login-error" class="text-brand-danger text-xs text-center mt-3"></p>
                </form>
            </div>
        </div>
        <div class="bg-brand-darkBg/60 border-t border-brand-border px-6 py-4 text-center">
            <small class="text-brand-muted text-xs">
                <i class="bi bi-shield-fill text-brand-purple mr-1"></i> Secure Surveillance Platform
            </small>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/login.js?v=1.2"></script>
</body>

</html>
