<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ANG Smart Access — Sign In" />
    <title>ANG Smart Access — Sign In</title>

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-notification {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            color: #0f172a;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .toast-success { border-left: 3px solid #10b981; }
        .toast-error { border-left: 3px solid #f43f5e; }
        .toast-info { border-left: 3px solid #0284c7; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px #ffffff inset !important;
            -webkit-text-fill-color: #0f172a !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>

<body class="min-h-screen text-slate-800 flex flex-col items-center justify-center p-4 antialiased selection:bg-sky-100 selection:text-sky-700">

    <div class="w-full max-w-sm">
        <!-- Main Card -->
        <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm p-7 space-y-6">
            
            <!-- Logo & Brand Header -->
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-sky-600 rounded-xl flex items-center justify-center mx-auto text-white text-xl shadow-md shadow-sky-600/20">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">ANG Smart Access</h1>
                    <p class="text-xs text-slate-500 mt-0.5">Sign in to your surveillance console</p>
                </div>
            </div>

            <!-- Error Banner -->
            <div id="login-error-container" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-lg text-rose-700 text-xs flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="bi bi-exclamation-circle-fill text-rose-500 shrink-0"></i>
                    <span id="login-error-text" class="font-medium"></span>
                </div>
                <button type="button" id="dismiss-error-btn" class="text-rose-400 hover:text-rose-600 ml-2">
                    <i class="bi bi-x"></i>
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4" novalidate>
                <!-- Username -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="login-username" class="text-xs font-semibold text-slate-700">Email or Username</label>
                        <button type="button" id="quick-fill-admin-btn" class="text-[11px] text-sky-600 hover:text-sky-700 font-medium">
                            Auto Fill Admin
                        </button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="bi bi-person text-sm"></i>
                        </span>
                        <input 
                            id="login-username" 
                            type="text" 
                            autocomplete="username"
                            class="w-full pl-9 pr-3.5 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition" 
                            placeholder="Username or email" 
                            required 
                        />
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="login-password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="bi bi-lock text-sm"></i>
                        </span>
                        <input 
                            id="login-password" 
                            type="password" 
                            autocomplete="current-password"
                            class="w-full pl-9 pr-9 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition" 
                            placeholder="Password" 
                            required 
                        />
                        <button 
                            type="button" 
                            id="toggle-password-btn" 
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 transition"
                            title="Toggle password visibility"
                        >
                            <i id="password-toggle-icon" class="bi bi-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center text-xs">
                    <label class="flex items-center space-x-2 cursor-pointer select-none">
                        <input 
                            id="remember-me" 
                            type="checkbox" 
                            class="w-3.5 h-3.5 rounded text-sky-600 focus:ring-sky-500 border-slate-300 cursor-pointer"
                        />
                        <span class="text-slate-600 text-xs">Remember me</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="login-submit-btn"
                    class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 active:scale-[0.99] transition text-white font-semibold rounded-lg text-xs flex items-center justify-center space-x-2 shadow-sm cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    <span id="btn-text">Sign In</span>
                </button>
            </form>
        </div>

        <!-- Clean Footer -->
        <p class="text-center text-[11px] text-slate-400 mt-5">
            © 2026 Techavo Systems • Smart Access Platform
        </p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="/static/login.js?v=5.0"></script>
</body>

</html>
