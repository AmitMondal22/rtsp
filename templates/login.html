<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="IP Camera Manager Login." />
    <title>Surveillance System — Sign In</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#9060ff',
                            blue: '#1a8cff',
                            darkBg: '#111217',
                            sidebar: '#1c1d22',
                            border: '#2b2c33',
                            muted: '#85868e',
                            danger: '#ef4444',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/style.css?v=1.2" />
</head>

<body class="bg-brand-darkBg text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-brand-blue selection:text-white">

    <div class="w-full max-w-md bg-brand-sidebar border border-brand-border rounded-lg shadow-2xl overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brand-blue/10 border border-brand-blue/30 rounded-full flex items-center justify-center mx-auto mb-3 text-brand-blue text-2xl">
                    <i class="bi bi-camera-video-fill"></i>
                </div>
                <h3 class="text-xl font-bold text-white">IP Camera Manager</h3>
                <p class="text-brand-muted text-xs mt-1">IP Camera Manager Surveillance System</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-brand-border mb-6">
                <button class="flex-1 pb-2.5 text-center text-sm font-semibold border-b-2 border-brand-blue text-white" id="tab-login-btn">
                    <i class="bi bi-box-arrow-in-right mr-1.5"></i> Sign In
                </button>
                <button class="flex-1 pb-2.5 text-center text-sm font-semibold border-b-2 border-transparent text-brand-muted hover:text-white" id="tab-register-btn">
                    <i class="bi bi-person-plus mr-1.5"></i> Register
                </button>
            </div>

            <!-- Forms Container -->
            <div>
                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input id="login-username" type="text" class="w-full pl-10 pr-4 py-2 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Enter username" required />
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input id="login-password" type="password" class="w-full pl-10 pr-4 py-2 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Enter password" required />
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-brand-blue hover:bg-brand-blue/90 active:scale-[0.98] transition text-white font-bold rounded text-sm mt-6 flex items-center justify-center">
                        <i class="bi bi-shield-lock mr-2"></i> Sign In
                    </button>
                    <p id="login-error" class="text-brand-danger text-xs text-center mt-3"></p>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input id="reg-username" type="text" class="w-full pl-10 pr-4 py-2 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Min 3 characters" required />
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input id="reg-email" type="email" class="w-full pl-10 pr-4 py-2 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Enter email" required />
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-brand-muted mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brand-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input id="reg-password" type="password" class="w-full pl-10 pr-4 py-2 bg-brand-darkBg border border-brand-border rounded text-sm text-slate-100 placeholder-brand-muted focus:outline-none focus:border-brand-blue" placeholder="Min 6 characters" required />
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-brand-blue hover:bg-brand-blue/90 active:scale-[0.98] transition text-white font-bold rounded text-sm mt-6 flex items-center justify-center">
                        <i class="bi bi-person-plus mr-2"></i> Register
                    </button>
                    <p id="register-error" class="text-brand-danger text-xs text-center mt-3"></p>
                </form>
            </div>
        </div>
        <div class="bg-brand-darkBg/60 border-t border-brand-border px-6 py-4 text-center">
            <small class="text-brand-muted text-xs">
                <i class="bi bi-shield-fill text-brand-purple mr-1"></i> Secure Surveillance Platform
            </small>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/login.js?v=1.2"></script>
</body>

</html>
